<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A.R.E.S Admin Login</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#050816;
      overflow:hidden;
    }

    /* Background Glow */
    .glow{
      position:absolute;
      width:500px;
      height:500px;
      background:#00e5ff;
      border-radius:50%;
      filter:blur(150px);
      opacity:0.2;
    }

    /* Login Box */
    .login-container{
      position:relative;
      width:400px;
      padding:40px;
      border-radius:25px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(20px);
      border:1px solid rgba(0,229,255,0.3);
      box-shadow:0 0 30px rgba(0,229,255,0.2);
      color:white;
    }

    .logo{
      text-align:center;
      margin-bottom:30px;
    }

    .logo h1{
      font-size:38px;
      color:#00e5ff;
      letter-spacing:3px;
      margin-bottom:10px;
    }

    .logo p{
      color:#ccc;
      font-size:14px;
    }

    .input-box{
      margin-bottom:25px;
    }

    .input-box label{
      display:block;
      margin-bottom:8px;
      color:#ddd;
      font-size:14px;
    }

    .input-box input{
      width:100%;
      padding:14px;
      border:none;
      outline:none;
      border-radius:12px;
      background:rgba(0,0,0,0.4);
      color:white;
      border:1px solid rgba(0,229,255,0.2);
      transition:0.3s;
    }

    .input-box input:focus{
      border-color:#00e5ff;
      box-shadow:0 0 10px rgba(0,229,255,0.5);
    }

    .login-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#00e5ff;
      color:black;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
      font-size:16px;
    }

    .login-btn:hover{
      background:#00c8e0;
      transform:scale(1.02);
      box-shadow:0 0 20px rgba(0,229,255,0.5);
    }

    .message{
      margin-top:20px;
      text-align:center;
      color:#00e5ff;
      font-size:14px;
    }

    .footer{
      margin-top:25px;
      text-align:center;
      color:#666;
      font-size:12px;
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="login-container">

    <div class="logo">
      <h1>A.R.E.S</h1>
      <p>Crime Intelligence Admin Portal</p>
    </div>

    <form id="loginForm">

      <div class="input-box">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" required>
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="login-btn">
        Secure Login
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="footer">
      A.R.E.S Neural Crime Intelligence System
    </div>

  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      message.innerText = "Authenticating...";

      try {

        const response = await fetch("http://localhost:8000/admin/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username,
            password
          })
        });

        const data = await response.json();

        if(response.ok){

          localStorage.setItem("token", data.token);

          message.innerText = "Login Successful";

          // Redirect Later
          // window.location.href = "dashboard.html";

        } else {
          message.innerText = data.detail || "Login Failed";
        }

      } catch (error) {

        message.innerText = "Server Connection Error";

      }
    });
  </script>

</body>
</html>
